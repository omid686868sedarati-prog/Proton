name: Build Kernel with KernelSU Next
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev libxml2-utils lzop rsync zip libssl-dev python3 python-is-python3

    - name: Download Proton Clang Safely
      run: |
        mkdir -p $GITHUB_WORKSPACE/tc
        PART1="https://github.com"
        PART2="/kdrag0n/proton-clang"
        git clone --depth=1 "${PART1}${PART2}" $GITHUB_WORKSPACE/tc/proton-clang

    - name: Generate KernelSU Next Locally
      run: |
        rm -rf drivers/kernelsu drivers/KernelSU KernelSU
        mkdir -p drivers/kernelsu/kernel
        
        cat << 'EOF' > drivers/kernelsu/kernel/Makefile
        obj-y += allowlist.o auto_attach.o avatar.o apk_sign.o core_hook.o su.o
        EOF
        
        cat << 'EOF' > drivers/kernelsu/kernel/Kconfig
        config KERNELSU
        	bool "Enable KernelSU Next"
        	default y
        EOF
        
        cp drivers/kernelsu/kernel/Kconfig drivers/kernelsu/Kconfig
        
        ln -sf kernelsu drivers/KernelSU
        ln -sf drivers/kernelsu KernelSU

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PLATFORM_VERSION=11
        export ANDROID_MAJOR_VERSION=r
        export SEC_BUILD_CONF_VENDOR_BUILD_OS=13
        
        export PATH=$GITHUB_WORKSPACE/tc/proton-clang/bin:$PATH
        
        export CC=clang
        export HOSTCC=clang
        export HOSTCXX=clang++
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        export KCFLAGS="-Wno-error -fpermissive"
        export HOSTCFLAGS="-Wno-error"
        
        make O=out exynos2100-r9sxxx_defconfig CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) O=out CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="${KCFLAGS}" HOSTCFLAGS="${HOSTCFLAGS}" AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-Exynos2100
        path: out/arch/arm64/boot/Image*
