name: Patch Proton Kernel with KernelSU Next
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Download Boot Image and Patch Tools
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        
        # Download the official KernelSU Patcher script
        curl -o ksu_patcher https://githubusercontent.com
        chmod +x ksu_patcher
        
        # ⚠️ LINK GENERATION: Place your temporary direct boot.img download link below
        # For example: curl -L -o boot.img "https://your-upload-site.com"
        curl -L -o boot.img "https://github.io" || touch boot.img

    - name: Execute Patch for Linux 5.4
      run: |
        if [ -f "boot.img" ] && [ -s "boot.img" ]; then
          ./ksu_patcher -b boot.img -o $GITHUB_WORKSPACE/output/patched_boot.img
        else
          echo "Error: boot.img is missing or empty. Please ensure the link in the previous step is correct."
          exit 1
        fi

    - name: Upload Patched Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: Patched-Proton-Kernel
        path: output/patched_boot.img
