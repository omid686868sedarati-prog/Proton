name: Build Kernel with KernelSU Next
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev libxml2-utils lzop rsync zip libssl-dev python3 python-is-python3 clang-14 lld-14 llvm-14

    - name: Download KernelSU Next safely
      run: |
        rm -rf drivers/kernelsu drivers/KernelSU KernelSU
        mkdir -p drivers/kernelsu
        
        PART1="https://github.com"
        PART2="/KernelSU-Next/KernelSU-Next"
        PART3="/archive/refs/heads/main.tar.gz"
        
        FULL_URL="${PART1}${PART2}${PART3}"
        curl -LSs "$FULL_URL" | tar -xz -C drivers/kernelsu --strip-components=1
        
        if [ -f "drivers/kernelsu/kernel/Kconfig" ]; then
          cp drivers/kernelsu/kernel/Kconfig drivers/kernelsu/Kconfig
        fi
        
        ln -sf kernelsu drivers/KernelSU
        ln -sf drivers/kernelsu KernelSU

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PLATFORM_VERSION=11
        export ANDROID_MAJOR_VERSION=r
        export SEC_BUILD_CONF_VENDOR_BUILD_OS=13
        
        # معرفی و ست کردن کامپایلر رسمی لینوکس برای کل سیستم ساخت
        export CC=clang-14
        export HOSTCC=clang-14
        export HOSTCXX=clang++-14
        
        make O=out exynos2100-r9sxxx_defconfig CC=clang-14 HOSTCC=clang-14
        make -j$(nproc) O=out CC=clang-14 HOSTCC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-Exynos2100
        path: out/arch/arm64/boot/Image*
