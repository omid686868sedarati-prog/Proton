name: Build Kernel with KernelSU Next
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev libxml2-utils lzop rsync zip libssl-dev

    - name: Download KernelSU Next to Right Path
      run: |
        # حذف پوشه احتمالی قدیمی برای جلوگیری از تداخل
        rm -rf drivers/kernelsu drivers/KernelSU
        # دانلود مستقیم سورس در مسیر مورد نیاز با حروف کوچک
        git clone --depth=1 https://github.com drivers/kernelsu

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # اجرای اسکریپت بومی پروژه برای ساخت خودکار کرنل
        chmod +x build_kernel.sh
        ./build_kernel.sh
        
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-Exynos2100
        path: out/arch/arm64/boot/Image*
