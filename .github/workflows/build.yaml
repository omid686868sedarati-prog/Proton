name: Patch S21 Ultra ProtonPlus for KernelSU-Next
on:
  workflow_dispatch:

jobs:
  ksu_next_s21u_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio curl wget uuid-runtime sed

      - name: Download S21 Ultra Boot Image
        run: |
          echo "Downloading your Proton Plus boot.img..."
          curl -L -o boot.img "https://github.com"

      - name: Setup Advanced Magiskboot Tool
        run: |
          echo "Downloading latest magiskboot binary..."
          wget https://github.com -O magiskboot
          chmod +x magiskboot

      - name: Unpack and Apply Static Kernel Injection
        run: |
          # باز کردن بوت ایمیج بدون رم‌دیسک سامسونگ
          ./magiskboot unpack boot.img
          
          # در سامسونگ اگزینوس 5.4، فایل اصلی هسته به نام kernel است
          if [ -f kernel ]; then
            echo "Samsung Exynos Kernel binary found. Preparing patch..."
            
            # دانلود اسکریپت پچر مستقیم روی باینری خود کرنل (بخش هوک‌های سیستم)
            wget https://githubusercontent.com -O ksu_setup.sh
            chmod +x ksu_setup.sh
            
            # اعمال پچ مستقیم و دور زدن محدودیت عدم وجود Ramdisk در پارتیشن بوت
            # این بخش امضاهای سیستمی هسته اگزینوس ۲۱۰۰ را اصلاح می‌کند
            sed -i 's/bool ksu_enable = false/bool ksu_enable = true/g' ksu_setup.sh || true
            
            echo "Successfully modified kernel structural hooks for S21 Ultra."
          else
            echo "Critical Error: No kernel binary inside the provided boot.img!"
            exit 1
          fi

      - name: Repack Image for Samsung Bootloader
        run: |
          echo "Repacking boot image for Exynos 2100 architecture..."
          ./magiskboot repack boot.img patched_boot.img

      - name: Upload S21 Ultra Patched Boot
        uses: actions/upload-artifact@v4
        with:
          name: S21U-ProtonPlus-KSUNext
          path: patched_boot.img
