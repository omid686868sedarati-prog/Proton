name: Build Kernel with KernelSU Next
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev libxml2-utils lzop rsync zip
        
    - name: Download Google Toolchains
      run: |
        mkdir -p $GITHUB_WORKSPACE/tc
        # دانلود کامپایلر پیش‌فرض AArch64 GCC برای سازگاری با اسکریپت‌های اگزینوس
        git clone --depth=1 https://googlesource.com $GITHUB_WORKSPACE/tc/gcc
        # دانلود کامپایلر Clang گوگل
        git clone --depth=1 https://googlesource.com $GITHUB_WORKSPACE/tc/clang

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # معرفی مسیر کامپایلرهای دانلود شده به سیستم
        export PATH=$GITHUB_WORKSPACE/tc/clang/bin:$GITHUB_WORKSPACE/tc/gcc/bin:$PATH
        
        # تنظیم متغیرهای کامپایل مخصوص پردازنده‌های Exynos
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        
        # ایجاد پوشه خروجی و بارگذاری کانفیگ اگزینوس ۲۱۰۰ شما
        make O=out exynos2100-r9sxxx_defconfig
        
        # شروع کامپایل
        make -j$(nproc) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-Exynos2100
        path: out/arch/arm64/boot/Image*
