name: Build Kernel with KernelSU Next
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev libxml2-utils lzop rsync zip libssl-dev

    - name: Download Proton Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/tc
        # دانلود نسخه بهینه و سبک Proton Clang مخصوص کامپایل اگزینوس و اسنپ‌دراگون
        git clone --depth=1 https://github.com $GITHUB_WORKSPACE/tc/proton-clang

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # معرفی مسیر Proton Clang به سرور
        export PATH=$GITHUB_WORKSPACE/tc/proton-clang/bin:$PATH
        
        # متغیرهای استاندارد کامپایل با Proton Clang
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # ایجاد پوشه خروجی و لود کردن کانفیگ اگزینوس شما
        make O=out exynos2100-r9sxxx_defconfig
        
        # شروع عملیات کامپایل کرنل
        make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-Exynos2100
        path: out/arch/arm64/boot/Image*
