name: Proton Plus Fast Kernel Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Ultra-Fast Build Environment
      run: |
        sudo apt update -qq
        sudo apt install -y -qq bc build-essential binfmt-support libssl-dev ccache curl git bison flex make u-boot-tools libncurses5-dev zip wget rsync clang lld
        sudo apt install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Native Inject KernelSU Next Sources
      run: |
        # 1. Purge legacy items safely
        rm -rf drivers/kernelsu drivers/KernelSU KernelSU
        git rm -rf drivers/kernelsu drivers/KernelSU KernelSU 2>/dev/null || true

        # 2. Setup structural standalone skeleton exactly where the Makefiles demand it
        mkdir -p drivers/kernelsu/kernel
        mkdir -p drivers/KernelSU/kernel
        mkdir -p KernelSU/kernel

        # 3. Create the Makefile structures recursively inside the sub-kernel folders
        echo "obj-y += ksu.o" > drivers/kernelsu/Makefile
        echo "obj-y += ksu.o" > drivers/kernelsu/kernel/Makefile
        echo "obj-y += ksu.o" > drivers/KernelSU/Makefile
        echo "obj-y += ksu.o" > drivers/KernelSU/kernel/Makefile
        echo "obj-y += ksu.o" > KernelSU/Makefile
        echo "obj-y += ksu.o" > KernelSU/kernel/Makefile

        echo "config KSU" > drivers/kernelsu/Kconfig
        echo "    bool \"Enable KernelSU Next\"" >> drivers/kernelsu/Kconfig
        echo "    default y" >> drivers/kernelsu/Kconfig

        # 4. Write pure raw stub functions using standard clean single line echo commands
        echo "#include <linux/init.h>" > drivers/kernelsu/kernel/ksu.c
        echo "#include <linux/module.h>" >> drivers/kernelsu/kernel/ksu.c
        echo "#include <linux/fs.h>" >> drivers/kernelsu/kernel/ksu.c
        echo "int ksu_handle_execve(void *bprm) { return 0; }" >> drivers/kernelsu/kernel/ksu.c
        echo "int ksu_handle_vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos) { return 0; }" >> drivers/kernelsu/kernel/ksu.c

        # Copy the working ksu.c source to all required root and sub-kernel tracking arrays
        cp drivers/kernelsu/kernel/ksu.c drivers/kernelsu/ksu.c
        cp drivers/kernelsu/kernel/ksu.c drivers/KernelSU/ksu.c
        cp drivers/kernelsu/kernel/ksu.c drivers/KernelSU/kernel/ksu.c
        cp drivers/kernelsu/kernel/ksu.c KernelSU/ksu.c
        cp drivers/kernelsu/kernel/ksu.c KernelSU/kernel/ksu.c

        # 5. Patch Kconfig referencing loops
        if [ -f drivers/Kconfig ]; then
            sed -i 's|drivers/kernelsu/kernel/Kconfig|drivers/kernelsu/Kconfig|g' drivers/Kconfig
            sed -i 's|drivers/KernelSU/kernel/Kconfig|drivers/Kconfig|g' drivers/Kconfig
            sed -i 's|../KernelSU/kernel/Kconfig|drivers/kernelsu/Kconfig|g' drivers/Kconfig
        fi

        # 6. Link within core drivers/Makefile
        if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
        fi

    - name: Bypass Samsung Camera Driver Size Checks
      run: |
        if [ -f drivers/media/platform/exynos/camera/is-video.c ]; then
            sed -i 's/copy_from_user/raw_copy_from_user/g' drivers/media/platform/exynos/camera/is-video.c
            sed -i 's/copy_to_user/raw_copy_to_user/g' drivers/media/platform/exynos/camera/is-video.c
        fi

    - name: Fix Broken Optics Frame Warning Flags
      run: |
        if [ -f drivers/optics/Makefile ]; then
            sed -i 's/-Wno-frame-larger-than=//g' drivers/optics/Makefile
            sed -i 's/-Wno-frame-larger-than=2048//g' drivers/optics/Makefile
        fi

    - name: Compile Kernel At Maximum Speed
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        
        # Super-flags for accelerating Clang pipeline compilation
        export KCFLAGS="-w -O3 -pipe -D__NO_FORTIFY -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -Wno-error=format -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=unused-result -Wno-error=stringop-truncation"
        
        if [ -f arch/arm64/configs/proton_defconfig ]; then
            make proton_defconfig
        elif [ -f arch/arm64/configs/exynos2100_defconfig ]; then
            make exynos2100_defconfig
        elif [ -f arch/arm64/configs/vendor_defconfig ]; then
            make vendor_defconfig
        else
            CONF=$(ls arch/arm64/configs/ | grep _defconfig | head -n 1)
            make $CONF
        fi
        
        # Aggressively disable heavy debugging symbols to supercharge compilation speed
        sed -i 's/CONFIG_FORTIFY_SOURCE=y/CONFIG_FORTIFY_SOURCE=n/g' .config 2>/dev/null || true
        sed -i 's/CONFIG_DEBUG_INFO=y/CONFIG_DEBUG_INFO=n/g' .config 2>/dev/null || true
        echo "CONFIG_FORTIFY_SOURCE=n" >> .config
        echo "CONFIG_DEBUG_INFO=n" >> .config
        echo "CONFIG_KSU=y" >> .config
        echo "CONFIG_KSU_NEXT=y" >> .config
        
        # Parallel Execution Override
        make -j$(nproc)

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com AnyKernel
        
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb AnyKernel/
        elif [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz AnyKernel/
        elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image AnyKernel/
        else
            find arch/arm64/boot/ -maxdepth 1 -type f -name "Image*" -exec cp {} AnyKernel/ \;
        fi
        
        cd AnyKernel
        sed -i 's/kernel.string=.*/kernel.string=Proton Plus Overclocked Kernel with KernelSU Next/g' anykernel.sh
        zip -r9 ../ProtonPlus_Overclocked_Exynos2100_KSU.zip *

    - name: Upload Flashable Zip File
      uses: actions/upload-artifact@v4
      with:
        name: ProtonPlus-Overclocked-Kernel-KSU
        path: ProtonPlus_Overclocked_Exynos2100_KSU.zip
