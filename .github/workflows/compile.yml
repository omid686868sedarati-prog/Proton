name: Proton Plus Kernel Compiler with KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc build-essential binfmt-support libssl-dev ccache curl git bison flex make u-boot-tools libncurses5-dev zip wget
        sudo apt install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld

    - name: Clean Conflicting Paths and Force Strip Kconfig Links
      run: |
        # Force remove legacy directories
        git rm -f drivers/kernelsu 2>/dev/null || true
        git rm -f drivers/KernelSU 2>/dev/null || true
        git rm -f KernelSU 2>/dev/null || true
        rm -rf drivers/kernelsu drivers/KernelSU KernelSU
        
        # Aggressive cleaning for any reference to KernelSU in drivers/Kconfig
        if [ -f drivers/Kconfig ]; then
            sed -i '/[kK][eE][rR][nN][eE][lL][sS][uU]/d' drivers/Kconfig
        fi

    - name: Integrate Official KernelSU Next via Native Clone
      run: |
        # Clone KernelSU Next source directly from git repository instead of downloading single script
        git clone https://github.com -b next drivers/kernelsu
        
        # Replicate the exact hardcoded paths requested by Samsung/Proton Makefiles
        mkdir -p KernelSU/kernel
        cp -r drivers/kernelsu/kernel/* KernelSU/kernel/
        cp -r drivers/kernelsu/* KernelSU/ 2>/dev/null || true
        
        mkdir -p drivers/KernelSU/kernel
        cp -r drivers/kernelsu/kernel/* drivers/KernelSU/kernel/

        # Ensure kernelsu is properly defined inside the core drivers/Makefile
        if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
        fi

    - name: Bypass Samsung Camera Driver Size Checks
      run: |
        # Fix camera driver fortify errors
        if [ -f drivers/media/platform/exynos/camera/is-video.c ]; then
            sed -i 's/copy_from_user/raw_copy_from_user/g' drivers/media/platform/exynos/camera/is-video.c
            sed -i 's/copy_to_user/raw_copy_to_user/g' drivers/media/platform/exynos/camera/is-video.c
        fi

    - name: Fix Broken Optics Frame Warning Flags
      run: |
        # Fix the empty -Wno-frame-larger-than= compiler option in optics drivers
        if [ -f drivers/optics/Makefile ]; then
            sed -i 's/-Wno-frame-larger-than=/-Wno-frame-larger-than=2048/g' drivers/optics/Makefile
        fi

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        
        # Inject standard global bypass flags
        export KCFLAGS="-w -D__NO_FORTIFY -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -Wno-error=format -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=unused-result -Wno-error=stringop-truncation"
        
        if [ -f arch/arm64/configs/proton_defconfig ]; then
            make proton_defconfig
        elif [ -f arch/arm64/configs/exynos2100_defconfig ]; then
            make exynos2100_defconfig
        elif [ -f arch/arm64/configs/vendor_defconfig ]; then
            make vendor_defconfig
        else
            CONF=$(ls arch/arm64/configs/ | grep _defconfig | head -n 1)
            make $CONF
        fi
        
        # Inject KernelSU configuration and turn off strict fortify source
        sed -i 's/CONFIG_FORTIFY_SOURCE=y/CONFIG_FORTIFY_SOURCE=n/g' .config 2>/dev/null || true
        echo "CONFIG_FORTIFY_SOURCE=n" >> .config
        echo "CONFIG_KSU=y" >> .config
        echo "CONFIG_KSU_NEXT=y" >> .config
        
        make -j$(nproc) || make

    - name: Package with AnyKernel3
      run: |
        curl -LO "https://github.com"
        unzip master.zip
        mv AnyKernel3-master AnyKernel
        
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb AnyKernel/
        elif [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz AnyKernel/
        elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image AnyKernel/
        else
            find arch/arm64/boot/ -maxdepth 1 -type f -name "Image*" -exec cp {} AnyKernel/ \;
        fi
        
        cd AnyKernel
        sed -i 's/kernel.string=.*/kernel.string=Proton Plus Overclocked Kernel with KernelSU Next/g' anykernel.sh
        zip -r9 ../ProtonPlus_Overclocked_Exynos2100_KSU.zip *

    - name: Upload Flashable Zip File
      uses: actions/upload-artifact@v4
      with:
        name: ProtonPlus-Overclocked-Kernel-KSU
        path: ProtonPlus_Overclocked_Exynos2100_KSU.zip
