name: Proton Plus Kernel Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc build-essential binfmt-support libssl-dev ccache curl git bison flex make u-boot-tools libncurses5-dev zip wget
        sudo apt install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld

    - name: Force Clean and Create Multi-Path Dummy Files
      run: |
        git rm -f drivers/kernelsu 2>/dev/null || true
        git rm -f drivers/KernelSU 2>/dev/null || true
        git rm -f KernelSU 2>/dev/null || true
        rm -rf drivers/kernelsu drivers/KernelSU KernelSU
        
        mkdir -p drivers/kernelsu/kernel
        echo "obj-y +=" > drivers/kernelsu/Makefile
        echo "obj-y +=" > drivers/kernelsu/kernel/Makefile
        echo "# Dummy" > drivers/kernelsu/Kconfig
        echo "# Dummy" > drivers/kernelsu/kernel/Kconfig
        
        mkdir -p drivers/KernelSU/kernel
        echo "obj-y +=" > drivers/KernelSU/Makefile
        echo "obj-y +=" > drivers/KernelSU/kernel/Makefile
        echo "# Dummy" > drivers/KernelSU/Kconfig
        echo "# Dummy" > drivers/KernelSU/kernel/Kconfig

        mkdir -p KernelSU/kernel
        echo "obj-y +=" > KernelSU/Makefile
        echo "obj-y +=" > KernelSU/kernel/Makefile

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        
        export KCFLAGS="-w -Wno-error=format -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
        
        if [ -f arch/arm64/configs/proton_defconfig ]; then
            make proton_defconfig
        elif [ -f arch/arm64/configs/exynos2100_defconfig ]; then
            make exynos2100_defconfig
        elif [ -f arch/arm64/configs/vendor_defconfig ]; then
            make vendor_defconfig
        else
            CONF=$(ls arch/arm64/configs/ | grep _defconfig | head -n 1)
            make $CONF
        fi
        
        make -j$(nproc)

    - name: Package with AnyKernel3
      run: |
        curl -LO "https://github.com"
        unzip master.zip
        mv AnyKernel3-master AnyKernel
        
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb AnyKernel/
        elif [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz AnyKernel/
        else
            cp arch/arm64/boot/Image AnyKernel/
        fi
        
        cd AnyKernel
        sed -i 's/kernel.string=.*/kernel.string=Proton Plus Overclocked Kernel/g' anykernel.sh
        zip -r9 ../ProtonPlus_Overclocked_Exynos2100.zip *

    - name: Upload Flashable Zip File
      uses: actions/upload-artifact@v4
      with:
        name: ProtonPlus-Overclocked-Kernel
        path: ProtonPlus_Overclocked_Exynos2100.zip
